name: Supabase keep-alive

# A free Supabase project pauses after 7 days of low activity (docs/ARCHITECTURE.md).
# Once a day this job performs a real read through the public API. On failure it opens
# an issue, or comments on the open one; on the next success it closes it.
# GitHub disables scheduled workflows after 60 days without commits on a public repo:
# re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: keepalive
  cancel-in-progress: false

env:
  ISSUE_TITLE: Supabase non risponde al controllo giornaliero

jobs:
  ping:
    name: Read the production database
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call health_check
        env:
          # Repository variables, not secrets: both values are public by design.
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Set the repository variables SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          for attempt in 1 2 3; do
            response=$(curl -sS --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/health_check" \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}' \
              -w $'\n%{http_code}') || response=$'curl failed\n000'
            status=${response##*$'\n'}
            body=${response%$'\n'*}
            echo "Attempt $attempt: HTTP $status, body $body"
            if [ "$status" = 200 ] && [ "$body" = true ]; then exit 0; fi
            sleep 20
          done
          echo "::error::health_check did not answer true after 3 attempts."
          exit 1

      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body="Il controllo del $(date -u +%F) è fallito: $RUN_URL

          Se il progetto è in pausa, riattivalo dalla dashboard di Supabase (Restore project)."
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" --body "$body"
          fi

      - name: Close the issue once the check passes again
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Il controllo del $(date -u +%F) è tornato a rispondere."
          fi
